[project]
name = "youtube-mcp"
version = "0.1.0"
description = "Self-hosted MCP server exposing YouTube transcripts, search, comments and stats."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "anyio",
    "fastmcp==4.0.10",
    "httpx",
    "pydantic>=2.12",
    "pydantic-settings",
    "uvicorn",
    "youtube-transcript-api==1.2.4",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
youtube-mcp = "youtube_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=youtube_mcp --cov-report=term-missing -q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Pragmatic, not exhaustive: correctness (E/W/F), import order (I), simplification (SIM),
# pyupgrade (UP) and bugbears (B). No opinionated style families (D, ANN, PL) yet.
select = ["E", "W", "F", "I", "SIM", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src/youtube_mcp"]

[[tool.mypy.overrides]]
module = ["youtube_mcp.*"]
strict = true
